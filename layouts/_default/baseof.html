<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ .Title }}</title>

  <meta name="description" content="Search Metro Vancouver homes, Tri-Cities open houses, new homes, homes by price range, and foreclosure listings. Get personalized MLS® home searches for Coquitlam, Port Coquitlam, Port Moody, and surrounding communities.">

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    nav {
      background: #0a2a66;
      padding: 25px;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 25px;
      font-size: 22px;
      font-weight: bold;
    }

    .content {
      max-width: 1000px;
      margin: 15px auto;
      background: white;
      padding: 15px 40px 40px;
    }
    .callout {
    border-left: 5px solid #3aa0ff;
    padding-left: 18px;
    margin: 25px 0;
    font-size: 22px;
    font-weight: 600;
}
footer {
    background: #4a4a4a;
    color: white;
    padding: 25px 40px;
    text-align: center;
    margin-top: 0;
    font-size: 18px;
    line-height: 1.8;
}
.hero {
  text-align: center;
  padding: 10px 20px 40px;
}

.hero h1 {
  font-size: 56px;
  line-height: 1.15;
  margin-bottom: 20px;
}

.hero-text {
  font-size: 20px;
  margin-bottom: 30px;
}

.button-row {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}

.main-button,
.contact-button {
  display: inline-block;
  background: #0a2a66;
  color: white;
  text-decoration: none;
  padding: 16px 28px;
  border-radius: 8px;
  font-weight: bold;
  font-size: 18px;
}

.realtor-card {
  max-width: 750px;
  margin: 40px auto;
  padding: 30px;
  border-top: 1px solid #ddd;
}

.realtor-info {
  display: flex;
  gap: 25px;
  align-items: center;
}

.realtor-photo {
  width: 120px;
  border-radius: 10px;
}

.brand {
  color: white;
  text-decoration: none;
  font-size: 30px;
  font-weight: bold;
  letter-spacing: 3px;
}

.tagline {
  color: white;
  font-size: 13px;
  letter-spacing: 2px;
  margin-top: 4px;
  text-transform: uppercase;
}

@media (max-width: 700px) {
  .hero h1 {
    font-size: 32px;
  }

  .realtor-info {
    flex-direction: column;
    text-align: center;
  }
}
  </style>

</head>

<body>

<nav>
  <a href="/" class="brand">VANMETRO</a>
  <div class="tagline">Metro Vancouver Real Estate</div>
</nav>

   <div class="content">
    {{ block "main" . }}
    {{ end }}
  </div>

  <footer>
    <strong>Coldwell Banker Universe Realty</strong><br>
    2010 East 48 Ave, Unit 201<br>
    Vancouver, BC V5P 1R8<br>
    Phone: 604-584-1444
  </footer>

</body>
</html>
